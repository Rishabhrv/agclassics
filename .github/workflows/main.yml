name: Deploy AG Classics Frontend
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 600s
          script: |
            set -e
            cd /home/rishabhvyas/EbookApp/agclassics
            git reset --hard
            git pull origin master
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 24.2.0
            npm install
            npm run build

            # ✅ SAFE: check if already registered in PM2, never create duplicates
            if pm2 describe agclassics > /dev/null 2>&1; then
              pm2 restart agclassics --update-env
            else
              pm2 start npm --name "agclassics" -- start -- --port 3001
            fi

            pm2 save
            echo "✅ AG Classics Frontend Deployment Successful!"